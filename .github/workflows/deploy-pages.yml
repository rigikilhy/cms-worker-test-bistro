name: Deploy Cloudflare Pages
run-name: CMS deploy ${{ inputs.deployId }} for ${{ inputs.clientId }}

on:
  workflow_dispatch:
    inputs:
      clientId:
        description: Client id from the shared CMS deploy Worker
        required: true
        type: string
      commitSha:
        description: Exact saved revision to build
        required: true
        type: string
      deployId:
        description: Unique deploy id generated by the shared CMS deploy Worker
        required: true
        type: string

concurrency:
  group: pages-production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_COMMIT_SHA: ${{ inputs.commitSha }}
      GITHUB_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commitSha }}
      - run: node scripts/check-deploy-revision.mjs
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/check-deploy-revision.mjs
      - run: pnpm exec wrangler pages deploy out --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch "$GITHUB_BRANCH"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT: cms-worker-test-bistro
          GITHUB_BRANCH: ${{ github.ref_name }}
